name: Deploy

on:
  push:
    branches:
      - main
      - test

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DEPLOY_HOST: prodesk
      DEPLOY_USER: junxu
      DEPLOY_PATH: /home/junxu/split-pro
      DEPLOY_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: prodesk

      - name: Add SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to prodesk
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' \
            DEPLOY_BRANCH='$DEPLOY_BRANCH' \
            REPOSITORY_URL='$REPOSITORY_URL' \
            sh -se" <<'EOF'
              if [ ! -d "$DEPLOY_PATH/.git" ]; then
                if [ -e "$DEPLOY_PATH" ]; then
                  echo "Deployment path exists but is not a Git checkout: $DEPLOY_PATH" >&2
                  exit 1
                fi

                mkdir -p "$(dirname "$DEPLOY_PATH")"
                git clone --branch "$DEPLOY_BRANCH" --single-branch "$REPOSITORY_URL" "$DEPLOY_PATH"
              fi

              if [ ! -f "$DEPLOY_PATH/.env" ]; then
                echo "Missing $DEPLOY_PATH/.env; create it from .env.example on prodesk before deploying." >&2
                exit 1
              fi

              cd "$DEPLOY_PATH"
              git fetch origin "$DEPLOY_BRANCH"
              git checkout "$DEPLOY_BRANCH"
              git pull --ff-only origin "$DEPLOY_BRANCH"
              docker compose -f docker/prod/compose.yml up -d --build
          EOF
